# docker-compose.yml — ActiveMemoryIndex self-hosted memory service.
#
#   docker compose up -d        # build + start
#   docker compose ps           # status
#   docker compose logs -f      # tail logs
#   docker compose down         # stop
#
# This file is self-contained: `docker compose up -d` works on any host with
# Docker. To publish it through an existing Cloudflare tunnel instead, add
# docker-compose.edge.yml as an override:
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d

services:
  activememoryindex:
    build:
      context: .
    image: ${AMI_IMAGE:-activememoryindex:latest}
    container_name: ${AMI_CONTAINER:-activememoryindex}
    env_file:
      - path: .env
        required: false
    environment:
      # Override at the shell for local testing: AMI_AUTH_SCHEME=none docker compose up -d
      - AMI_AUTH_SCHEME=${AMI_AUTH_SCHEME:-bearer}
      - AMI_AGENTIC_SEARCH=${AMI_AGENTIC_SEARCH:-0}
      - AMI_RETURN_LIMIT=${AMI_RETURN_LIMIT:-100}
      - AMI_RAW_FIRST=${AMI_RAW_FIRST:-1}
      - AMI_WINDOW_RADIUS=${AMI_WINDOW_RADIUS:-1}
    volumes:
      # SQLite database + any persistent state.
      - ami-data:/data
    ports:
      # Loopback by default: this service holds other people's memories and the
      # auth token may still be unset. Set AMI_BIND=0.0.0.0 (or put a proxy in
      # front) once you have configured a real AMI_AUTH_TOKEN.
      - "${AMI_BIND:-127.0.0.1}:${AMI_PORT:-8000}:8000"
    restart: unless-stopped
    logging:
      # A 72-hour evaluation run otherwise fills the disk with access logs.
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  ami-data:
    # Overridable so a second clone on the same host cannot silently attach to
    # an existing deployment's store.
    name: ${AMI_VOLUME:-ami-data}
